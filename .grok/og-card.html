<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: Gloock;
  src: url("og-fonts/gloock-400-normal.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: Playfair;
  src: url("og-fonts/playfair-display-900-normal.woff2") format("woff2");
  font-weight: 900;
  font-style: normal;
}
@font-face {
  font-family: Cormorant;
  src: url("og-fonts/cormorant-garamond-500-italic.woff2") format("woff2");
  font-weight: 500;
  font-style: italic;
}
@font-face {
  font-family: Vibes;
  src: url("og-fonts/great-vibes-400-normal.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #1f3a2d; }
.stage {
  position: relative;
  width: 1200px;
  height: 630px;
  background:
    radial-gradient(ellipse 78% 70% at 50% 42%, #4a6754 0%, #36503f 46%, #24382c 78%, #1a2c22 100%);
  color: #f6f3ee;
  font-synthesis: none;
}
.grain {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0 0.7  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.28;
  mix-blend-mode: overlay;
  pointer-events: none;
}
.wash {
  position: absolute;
  left: 18%; right: 18%; top: 16%; bottom: 22%;
  background: radial-gradient(ellipse at center, rgba(246,243,238,.16) 0%, rgba(246,243,238,0) 70%);
  pointer-events: none;
}
.frame {
  position: absolute;
  inset: 36px 48px;
  border: 1.5px solid rgba(214,176,122,.72);
  pointer-events: none;
}
.frame:before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(228,224,220,.18);
}
.corner {
  position: absolute;
  width: 28px; height: 28px;
  border-color: #d6b07a;
  border-style: solid;
}
.corner.tl { top: 28px; left: 40px; border-width: 2px 0 0 2px; }
.corner.tr { top: 28px; right: 40px; border-width: 2px 2px 0 0; }
.corner.bl { bottom: 28px; left: 40px; border-width: 0 0 2px 2px; }
.corner.br { bottom: 28px; right: 40px; border-width: 0 2px 2px 0; }
.lockup {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 160px;
  z-index: 3;
}
.star {
  color: #d6b07a;
  font-size: 22px;
  letter-spacing: 18px;
  margin-bottom: 18px;
  font-family: Gloock, serif;
}
h1 {
  font-family: Gloock, Playfair, "Liberation Serif", serif;
  font-weight: 400;
  font-size: 118px;
  line-height: 0.9;
  letter-spacing: 0.08em;
  color: #f6f3ee;
  text-shadow: 0 2px 0 rgba(31,58,45,.35), 0 18px 40px rgba(15,28,20,.35);
}
.rule {
  width: 340px;
  height: 1px;
  margin: 22px 0 18px;
  background: linear-gradient(90deg, transparent, #d6b07a 18%, #d6b07a 82%, transparent);
}
.tag {
  font-family: Cormorant, "Liberation Serif", serif;
  font-style: italic;
  font-weight: 500;
  font-size: 32px;
  letter-spacing: 0.06em;
  color: #e4e0dc;
}
.paws {
  position: absolute;
  left: 0; right: 0; bottom: 58px;
  text-align: center;
  color: #d6b07a;
  letter-spacing: 22px;
  font-size: 16px;
  opacity: 0.85;
  z-index: 3;
}
.trees { position: absolute; left: 0; right: 0; bottom: 0; height: 168px; z-index: 1; }
.firefly {
  position: absolute;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #d6b07a;
  box-shadow: 0 0 10px 4px rgba(214,176,122,.55);
  z-index: 2;
}
.cube {
  position: absolute;
  top: 78px; right: 92px;
  width: 42px; height: 42px;
  opacity: 0.7;
  z-index: 3;
}
</style>
</head>
<body>
<div class="stage">
  <svg class="trees" viewBox="0 0 1200 168" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#1a2c22" d="M0 168h1200V92c-70 18-140 8-210 22-80 16-150-8-230 10-70 16-130 4-190 18-90 20-160-6-250 8-70 12-130 2-200 16-40 8-80 4-120 12v-14z"/>
    <path fill="#24382c" d="M0 168h1200V118c-90 10-170-8-250 6-95 16-175 2-260 14-80 12-150-4-230 10-90 16-155 4-240 14-70 8-140 2-220 12z"/>
    <g fill="#1f3a2d">
      <path d="M86 168l38-96 38 96z"/>
      <path d="M210 168l28-72 28 72z"/>
      <path d="M980 168l44-108 44 108z"/>
      <path d="M1090 168l30-76 30 76z"/>
      <path d="M40 168l22-54 22 54z"/>
      <path d="M1148 168l20-50 20 50z"/>
    </g>
  </svg>
  <svg class="cube" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <path d="M32 6l24 12v28L32 58 8 46V18z" stroke="#d6b07a" stroke-width="2"/>
    <path d="M32 6v28M32 34L8 18M32 34l24-16" stroke="#d6b07a" stroke-width="1.4" opacity=".85"/>
  </svg>
  <span class="firefly" style="left:168px;top:150px"></span>
  <span class="firefly" style="left:240px;top:320px;width:4px;height:4px;opacity:.7"></span>
  <span class="firefly" style="left:980px;top:180px"></span>
  <span class="firefly" style="left:1040px;top:360px;width:3px;height:3px"></span>
  <span class="firefly" style="left:430px;top:120px;width:3px;height:3px;opacity:.65"></span>
  <span class="firefly" style="left:760px;top:128px"></span>
  <div class="wash"></div>
  <div class="grain"></div>
  <div class="frame"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="lockup">
    <div class="star">✦</div>
    <h1>JULIETH</h1>
    <div class="rule"></div>
    <p class="tag">Animación 3D & Arte Digital</p>
  </div>
  <div class="paws">🐾 🐾 🐾 🐾 🐾</div>
</div>
</body>
</html>
